services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  post-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: post_user
      POSTGRES_PASSWORD: post_password
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post_user -d post_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comment_db
      POSTGRES_USER: comment_user
      POSTGRES_PASSWORD: comment_password
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comment_user -d comment_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:auth_password@auth-db:5432/auth_db
      JWT_SECRET_KEY: dev-auth-secret
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8001:8000"

  auth-service-dapr:
    image: daprio/daprd:1.14.4
    command: ["./daprd", "-app-id", "auth-service", "-app-port", "8000", "-components-path", "/components"]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - auth-service
      - redis
    network_mode: "service:auth-service"

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://user_user:user_password@user-db:5432/user_db
    depends_on:
      user-db:
        condition: service_healthy
    ports:
      - "8002:8000"

  user-service-dapr:
    image: daprio/daprd:1.14.4
    command: ["./daprd", "-app-id", "user-service", "-app-port", "8000", "-components-path", "/components"]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - user-service
      - redis
    network_mode: "service:user-service"

  post-service:
    build:
      context: .
      dockerfile: services/post_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://post_user:post_password@post-db:5432/post_db
    depends_on:
      post-db:
        condition: service_healthy
    ports:
      - "8003:8000"

  post-service-dapr:
    image: daprio/daprd:1.14.4
    command: ["./daprd", "-app-id", "post-service", "-app-port", "8000", "-components-path", "/components"]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - post-service
      - redis
    network_mode: "service:post-service"

  comment-service:
    build:
      context: .
      dockerfile: services/comment_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://comment_user:comment_password@comment-db:5432/comment_db
    depends_on:
      comment-db:
        condition: service_healthy
    ports:
      - "8004:8000"

  comment-service-dapr:
    image: daprio/daprd:1.14.4
    command: ["./daprd", "-app-id", "comment-service", "-app-port", "8000", "-components-path", "/components"]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - comment-service
      - redis
    network_mode: "service:comment-service"

  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://notification_user:notification_password@notification-db:5432/notification_db
    depends_on:
      notification-db:
        condition: service_healthy
    ports:
      - "8005:8000"

  notification-service-dapr:
    image: daprio/daprd:1.14.4
    command: ["./daprd", "-app-id", "notification-service", "-app-port", "8000", "-components-path", "/components"]
    volumes:
      - ./dapr/components:/components
    depends_on:
      - notification-service
      - redis
    network_mode: "service:notification-service"
