[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "email-validator>=2.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "bcrypt>=4.0",
  "pwdlib>=0.2",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
